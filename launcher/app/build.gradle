plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Ordinary TV app: same package as the installed CleanYourTV app edition, so an update keeps its data.
        applicationId 'local.tv.cleanapps'
        minSdk 26
        targetSdk 34
        versionCode 58
        versionName '2.6-ordinary.49'
    }

    signingConfigs.debug.storeFile = file('/Users/didi/Documents/Codex/2026-10-20/tcl-github-https-github-com-gathin23/work/launcher-toolchain/android-user/debug.keystore')

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Liquid Glass 2.0 (QWEA0/Liquid-Glass-Android v2.0.11). The flip clock and any later
    // frosted panel go through LiquidGlassLayout, which only sets this library's parameters.
    implementation 'com.github.QWEA0:liquidglass:v2.0.11'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
